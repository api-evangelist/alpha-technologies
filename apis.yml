name: Alpha Technologies
description: >-
  Alpha Technologies is a power-systems manufacturer providing AC, DC, and renewable
  powering solutions for the telecom, cable-broadband, traffic, security, industrial,
  and alternative-energy industries. Its product line spans uninterruptible power
  supplies (UPS), standby and non-standby power systems, batteries, enclosures,
  network/fiber powering gear, and renewable-energy products. Founded in the 1980s
  and now part of EnerSys, Alpha operates as a hardware and stored-energy solutions
  provider rather than a public API platform; it was surfaced in the API Evangelist
  network as an Accel-associated portfolio lead and carries no public developer or
  API surface at the time of enrichment.
